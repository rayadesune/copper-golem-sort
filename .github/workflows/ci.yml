name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile + test against every version in the matrix. The matrix has one
  # entry since 0.6.0 (26.3 is the floor and the ceiling); the job is kept
  # because a second entry will come back the moment a newer Paper API needs
  # verifying, and because the job name is a required status check.
  compatibility:
    # NOTE: this job name becomes a required status check name in the branch
    # ruleset. Renaming it silently invalidates that requirement.
    name: MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.3']
    steps:
      - uses: actions/checkout@v4

      # JDK 25 is mandatory, not just convenient: paper-api 26.x is class file
      # 69 and the plugin emits Java 25 bytecode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + tests
        run: ./gradlew build -PmcVersion=${{ matrix.minecraft }}

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.minecraft }}
          path: build/reports/tests/test

  # The distributable artifact: built against 26.3, hence Java 25 bytecode.
  artifact:
    # NOTE: see the naming warning on the job above.
    name: Distributable jar
    runs-on: ubuntu-latest
    needs: compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build against the floor version
        run: ./gradlew build

      - name: Check the bytecode really is Java 25
        run: |
          jar=$(ls build/libs/*.jar)
          unzip -o -q "$jar" -d /tmp/cgp
          major=$(javap -verbose -cp /tmp/cgp dev.cgp.coppergolemsort.CopperGolemSortPlugin \
                  | grep -m1 'major version' | tr -dc '0-9')
          echo "class file major version = $major"
          if [ "$major" != "69" ]; then
            echo "::error::Bytecode $major instead of 69 (Java 25) - paper-api 26.3 and the build both target Java 25"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CopperGolemSort
          path: build/libs/*.jar
