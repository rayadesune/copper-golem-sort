name: Release

# Triggered by a version tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # Revalidate the supported matrix before publishing: a release must never
      # go out while one of the supported versions no longer compiles.
      - name: Verify the full matrix
        run: |
          for v in 26.3; do
            echo "::group::MC $v"
            ./gradlew build -PmcVersion=$v || exit 1
            echo "::endgroup::"
          done

      - name: Build the floor artifact
        run: ./gradlew clean build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="Compatible with Minecraft 26.3 (Paper). Requires Java 25 or newer."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release may already have been created by hand (backfilling a
            # historical version, or re-tagging after a rename). Publishing a tag
            # always fires this workflow, so treat an existing release as normal
            # and only refresh the artifact instead of failing on the duplicate.
            echo "release $TAG already exists - uploading assets only"
            gh release upload "$TAG" build/libs/*.jar --clobber
          else
            gh release create "$TAG" build/libs/*.jar \
              --title "$TAG" \
              --generate-notes \
              --notes "$NOTES"
          fi
