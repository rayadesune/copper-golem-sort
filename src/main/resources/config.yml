# =============================================================
# 以下 9 组可选，默认注释掉。**都不是 SCG 的分组**，是我扫 26.3 原版
# 物品 tag（共 236 个）时额外挑出来的，SCG 的 86 项里没有这些。
# 没启用各有原因：分类偏粗（蘑菇/土/沙/草方块）、价值差大（粒、铁栏杆、
# 锁链）、与已启用组重叠（下界木质）、用途互斥（其他桶）。
# 想去掉行首的 "# " 即可启用。
# =============================================================
# - name: "蘑菇"
#   items: ["#minecraft:mushrooms"]               # 3
# - name: "土"
#   items: ["#minecraft:dirt"]                    # 3
# - name: "沙"
#   items: ["#minecraft:sand"]                    # 3
# - name: "草方块"
#   items: ["#minecraft:grass_blocks"]            # 3
# - name: "下界木质"
#   items: ["#minecraft:non_flammable_wood"]      # 32
# - name: "粒"
#   items: ["#minecraft:metal_nuggets"]           # 3（铜粒/铁粒/金粒，价值差 20 倍）
# - name: "铁栏杆"
#   items: ["#minecraft:bars"]                    # 9（含铜栏杆）
# - name: "锁链"
#   items: ["#minecraft:chains"]                  # 9（含铜锁链）
