# ======================================================================
#  Copper Golem Patch - Configuration
# ======================================================================
# This plugin gives Copper Golems a persistent memory of chests, and
# lets them share that knowledge with each other, so they sort items
# faster and never get stuck holding an item with nowhere to put it.
#
# You don't have to touch anything: the defaults below work well for
# the vast majority of servers. This file just explains what each
# setting does, for whenever you want to tweak it.
# ======================================================================

# Master on/off switch for the plugin.
# Set to "false" to get vanilla golem behavior back without having to
# uninstall the plugin (handy for comparison, or if something goes
# wrong).
enabled: true

# ----------------------------------------------------------------------
# Communication between golems (the "swarm")
# ----------------------------------------------------------------------
# When two golems pass close to each other, they share what each of
# them has learned: which chest holds what, and which items currently
# have nowhere to go. That way a golem doesn't need to have visited a
# chest itself to know it exists.
gossip:
  # Set to "false" if you'd rather each golem only learn from its own
  # experience, without sharing anything with the others.
  enabled: true
  
  # Maximum distance (in blocks) between two golems for them to share
  # their knowledge when they pass each other. Increase this if your
  # golems work over a large area and rarely cross paths. Lower it if
  # you have a lot of golems clustered in the same spot (beyond
  # 50-100 nearby golems) and notice the server slowing down.
  radius: 12.0
  
  # How often (in game ticks - 20 ticks = 1 second) golems check
  # whether they're close enough to another golem to share knowledge.
  # A lower value makes sharing happen faster but costs a bit more
  # computation; a higher value saves resources but sharing takes
  # longer to spread.
  interval-ticks: 30

# ----------------------------------------------------------------------
# Each golem's memory
# ----------------------------------------------------------------------
memory:
  # Maximum number of different chests a golem keeps in memory. Past
  # this limit, it forgets the chest it has seen longest ago to make
  # room. Increase this if you have a very large setup (lots of
  # different chests) and golems seem to "forget" chests too quickly.
  max-entries-per-golem: 32
  
  # How long (in seconds) before a golem forgets what it learned about
  # a chest if it never passes by to recheck it. 1800 seconds = 30
  # minutes. You normally don't need to touch this setting.
  entry-ttl-seconds: 1800

# ----------------------------------------------------------------------
# What happens when an item has nowhere to go?
# ----------------------------------------------------------------------
# If a golem picks up an item from a copper chest but no storage chest
# will accept it (none are empty, none already hold that item type), it
# would otherwise wander around forever holding it. To avoid that, the
# golem puts it back in a copper chest and moves on to a different
# item, while remembering (and telling other golems about it via the
# sharing above) that this item currently has "nowhere to go".
give-up:
  # How long (in seconds) an item stays marked as "can't be sorted right
  # now" before the golem tries again.
  #
  # This is also how often a stuck golem retries, so keep it short. While
  # a golem holds nothing, the game only ever offers it copper chests to
  # look at - it never looks at a storage chest, so it cannot notice that
  # you just placed a new empty one. Retrying is what makes it find them.
  #
  # Raising this makes golems ignore newly placed chests for that long.
  # Lowering it makes them retry more often; the cost is one wasted trip
  # per retry, and only for a golem that has nothing else to do anyway.
  unplaceable-ttl-seconds: 20
  
  # Where should a give-up item go?
  #
  # true  = before dropping anything, the golem looks at copper chests and
  #         at chests/barrels in the 3x3 chunks around it (already-loaded
  #         chunks only) and puts the item into whatever can take it.
  # false = only copper chests are considered, and whatever does not fit
  #         is dropped on the ground (where it despawns after 5 minutes).
  #
  # Copper chests are always tried first, so items normally go back where
  # they came from and your sorted storage stays untouched.
  # Furnaces, hoppers, dispensers, brewing stands and shulker boxes are
  # never used as a fallback: they are machines or carried storage, and
  # quietly inserting a stack into one would break what you built.
  fallback-to-any-container: true
  
  # How long a golem may hold an item before it gives up and hands the item
  # back (in ticks, 20 ticks = 1 second).
  #
  # Counted from the moment it picks the item up, and NOT restarted when a
  # chest is evaluated again - restarting on every evaluation is exactly
  # what used to let a golem re-check one rejected chest forever.
  #
  # This is the short deadline, and it only applies while no chest has
  # accepted the carry. The moment one does, the deadline becomes 4x this
  # value (120 s), which is what rescues a golem whose "usable" chest it
  # can never actually walk to. So a golem with nowhere to put the item
  # recovers in 30 seconds, one with an unreachable target in at most 2
  # minutes.
  #
  # 600 = 30 seconds, comfortably longer than the walk to any chest within
  # vanilla's 65-block search radius. Raise it if your golems make very
  # long trips; lower it if you want stuck golems to recover faster.
  hold-timeout-ticks: 600
# ======================================================================
#  tidy —— 投放后自动整理（本服定制）
#  ----------------------------------------------------------------------
#  为什么需要：原版铜傀儡每趟最多搬 16 件，且只往"最靠前的可用槽"塞，
#  不会把 16 并进后面那个 40/64 的同类堆。所以 64 件投 4 趟会变成
#  4 个 16 而不是 1 个 64，箱子很快被碎片占满、之后就没地方放了。
#  这里在它投放完成后把容器内容合并成满堆，并可按分类排序。
#
#  作用范围：只处理【铜傀儡判定可以投放的箱子】，你手动摆的箱子完全不动。
#  安全限制：有人正在查看该箱子时跳过，避免和拖拽中的物品冲突。
# ======================================================================
tidy:
  enabled: true
  merge: true # 合并同类碎片：4×16 -> 1×64
  sort: true # 合并后按 similar-items 的分组排序，同组物品相邻
  delay-ticks: 40 # 投放后等 40 tick(2秒) 再整理，避开原版插入过程
  skip-viewed: true # 有人打开该箱子时跳过（不要改成 false）
  debug: false # true 时把每次整理的"堆数变化"打进日志


# ======================================================================
#  similar-items —— 同类物品匹配（0.3.0 新增，本服定制）
#  ----------------------------------------------------------------------
#  原版规则：目标箱必须【完全空】或【已存在同一种物品 ID】才允许投放。
#  开启本段后，只要手持物品与箱内已有物品命中【同一个分组】，也允许投放。
#  分组按【类型】划分（所有台阶 / 所有楼梯 / 所有剑 / 所有镐...），不按材质。
#  下面 76 组来自 Smart Copper Golem 的分组清单，并已按 26.3 实际 tag 校正。
# ======================================================================

# =====================================================================
# Copper Golem Patch 0.3.0 —— 同类物品分组（similar items）
# =====================================================================
# 分组严格对齐 Smart Copper Golem(SCG) 的 ALLOWED_ITEM_CATEGORY_TAGS
# （scg/src/main/kotlin/org/nxy/smartcoppergolem/memory/CopperGolemDeepMemory.kt 第 47-142 行）
#
# SCG 共 52 个原版标签 + 34 个 Fabric 专有标签，本配置处理方式：
#   - 52 个原版标签：全部 1:1 保留，一组不删
#   - 34 个 Fabric 标签：能映射到原版标签的直接映射（如 CONCRETES -> #concrete），
#     原版没有对应标签的改为手写物品 ID（玻璃、唱片、水桶、药水、芽、砂岩、高花、生熟食物）
#
# 分类原则（与你确认的一致）：按【类型】分组，不按【材质】分组。
#   即：所有台阶一组、所有楼梯一组、所有剑一组、所有镐一组。
#   SCG 里唯一带材质色彩的是 wooden_* 系列（木质门/活板门/栅栏等），
#   这是 SCG 原样，且其中"木楼梯/木台阶"被"所有楼梯/所有台阶"完全包含（等于失效）。
#
# 写法：
#   "#minecraft:xxx" -> 原版物品 tag，运行时解析（26.4 新增物品自动跟随）
#   "minecraft:xxx"  -> 具体物品 ID
#   tag 解析失败     -> 启动日志明确列出组名，不会静默失效
#
# 匹配规则：手持物品 与 目标箱已有物品 命中【同一分组】-> 允许投放。
# 硬性前提：目标箱必须还有空槽（require-empty-slot），否则傀儡会走过去放不下、无限往返。
# =====================================================================

similar-items:
  enabled: true
  
  # 目标箱必须剩至少一个空槽才允许同类投放。强烈建议保持 true。
  require-empty-slot: true
  
  # true 时每次决策打印一行日志（手持物 / 箱子 / 命中组），排查用。平时关闭。
  debug: false
  
